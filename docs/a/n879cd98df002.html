<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冬季同人展去哦。新刊是关于美少女游戏的，据说写得非常夸张的同人志……</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2021-12-28 00:11</p>
  <h1>冬季同人展去哦。新刊是关于美少女游戏的，据说写得非常夸张的同人志……</h1>
  <p class="ja-title">冬コミでるよ。 新刊は美少女ゲームについて、ヤバいほど書きまくった同人誌らし…</p>
</header>
<main>
  <article class="body">冬コミでるよ。
新刊は美少女ゲームについて、ヤバいほど書きまくった同人誌らしい本です。よろしくお願いします。
詳細→https://twitter.com/nyalra/status/1475410669331959816?s=21</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2021-12-28 00:11\n冬季同人展去哦。新刊是关于美少女游戏的，据说写得非常夸张的同人志……\n冬コミでるよ。 新刊は美少女ゲームについて、ヤバいほど書きまくった同人誌らし…\n\n冬コミでるよ。\n新刊は美少女ゲームについて、ヤバいほど書きまくった同人誌らしい本です。よろしくお願いします。\n詳細→https://twitter.com/nyalra/status/1475410669331959816?s=21"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
