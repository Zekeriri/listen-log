<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巨大的音响设备</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2026-11-05 22:47</p>
  <h1>巨大的音响设备</h1>
  <p class="ja-title">でっかいスピキ</p>
</header>
<main>
  <article class="body">めちゃくちゃ忙しいので日記一回休み。

どでかいスピキに会えましたよ。

グッズは殆ど残っていなくて残念。逆に言えばコラボとして大成功ですね。トリッカルすごい!

スピキ焼きは売り切れていました。まあ閉店時間に近かったですし。
 見本が見れてうれしいよ。

コミー。

ぬいぐるみたち欲しいなあ。

階段を眺めていると、｢みんなに会いたいな｣という気持ちが溢れてくる。不思議な力があるイラストたち。打ち合わせ地獄の今(それはそれで嬉しいことですが)本当に癒される。

スピキまたね。
 ハロウィンでカボチャいっぱいで良かったね。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script>
const text = document.querySelector(".ja-title").textContent.trim() + "\n\n" + document.querySelector("article.body").textContent.trim();
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  else box.style.display = "none";
  toast.textContent = ok ? "已复制标题和全文" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 2500);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
