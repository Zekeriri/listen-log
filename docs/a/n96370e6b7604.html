<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简单的导览</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2026-04-16 20:06</p>
  <h1>简单的导览</h1>
  <p class="ja-title">軽い案内</p>
</header>
<main>
  <article class="body">ちょっと多忙で大変だったので、軽めの案内だけ。

シンセちゃんのテクノイベントを6月にもやるよ。
 前回が満員だったので、今回は箱的には人数3倍以上入れるところでやります。是非とも、みんな遊びにきてね。早い時間だし怖くないよ。

近づいたら、またちゃんと内容についても話します。
 原口さんと率いるCDsもめちゃくちゃ頑張っています！</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2026-04-16 20:06\n简单的导览\n軽い案内\n\nちょっと多忙で大変だったので、軽めの案内だけ。\n\nシンセちゃんのテクノイベントを6月にもやるよ。\n 前回が満員だったので、今回は箱的には人数3倍以上入れるところでやります。是非とも、みんな遊びにきてね。早い時間だし怖くないよ。\n\n近づいたら、またちゃんと内容についても話します。\n 原口さんと率いるCDsもめちゃくちゃ頑張っています！"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
