<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面向note订阅者的日记，这个月更新两次后将停刊。感谢一直以来的阅读…</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2023-04-07 22:26</p>
  <h1>面向note订阅者的日记，这个月更新两次后将停刊。感谢一直以来的阅读…</h1>
  <p class="ja-title">noteの購読者向け日記、今月で2回更新後に廃刊します。今まで読んでくれてあ…</p>
</header>
<main>
  <article class="body">noteの購読者向け日記、今月で2回更新後に廃刊します。今まで読んでくれてありがとうございました♪ 毎日の日記は続けるので、よければそちらも読んでいってくださいね。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2023-04-07 22:26\n面向note订阅者的日记，这个月更新两次后将停刊。感谢一直以来的阅读…\nnoteの購読者向け日記、今月で2回更新後に廃刊します。今まで読んでくれてあ…\n\nnoteの購読者向け日記、今月で2回更新後に廃刊します。今まで読んでくれてありがとうございました♪ 毎日の日記は続けるので、よければそちらも読んでいってくださいね。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
