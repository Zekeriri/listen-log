<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫展</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2026-11-12 20:59</p>
  <h1>漫展</h1>
  <p class="ja-title">コミー</p>
</header>
<main>
  <article class="body">まだまだ打ち合わせ地獄で日記は控えめです。
 打ち合わせが多い分、次の発表は近い上で気合い入っているということで。

たんプリ映画を観に行きました。
 アルカナシャドウがフォームチェンジ扱いで切り替わるのうれしいね。

会議が秋葉原のオフィス多めなので、時間までまたスピキを眺めます。
 スピキ帰らないで……一生アキバを見守っていてほしいよ。

今回はスピキ焼きも食べられました。チョワヨ。

バターを狙ってがんばっているうちに、コミーが引っ掛かりました。よろしくにゃ。

打ち合わせにもついて来てくれました。
 新作頑張ってるよー。

うれしいね。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script>
const text = document.querySelector(".ja-title").textContent.trim() + "\n\n" + document.querySelector("article.body").textContent.trim();
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  else box.style.display = "none";
  toast.textContent = ok ? "已复制标题和全文" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 2500);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
