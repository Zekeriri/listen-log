<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>将会有一部冬季漫画。新一期好像是一篇写了很多美少女游戏的同人志……</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2021-12-28 00:11</p>
  <h1>将会有一部冬季漫画。新一期好像是一篇写了很多美少女游戏的同人志……</h1>
  <p class="ja-title">冬コミでるよ。 新刊は美少女ゲームについて、ヤバいほど書きまくった同人誌らし…</p>
</header>
<main>
  <article class="body">冬コミでるよ。
新刊は美少女ゲームについて、ヤバいほど書きまくった同人誌らしい本です。よろしくお願いします。
詳細→https://twitter.com/nyalra/status/1475410669331959816?s=21</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制译文</button></div>
<div class="toast" id="toast"></div>
<script id="zh-copy" type="application/json">"将会有一部冬季漫画。新一期好像是一篇写了很多美少女游戏的同人志……\n\n将会有一部冬季漫画。\n新书是一本写得淋漓尽致的关于美少女游戏的同人志书籍。谢谢。\n详情 → https://twitter.com/nyalra/status/1475410669331959816?s=21"</script>
<script>
const text = JSON.parse(document.getElementById("zh-copy").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  else box.style.display = "none";
  toast.textContent = ok ? "已复制译文" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 2500);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
