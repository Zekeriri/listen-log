</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2026-05-11 15:32</p>
  <h1>人员扩张</h1>
  <p class="ja-title">人員拡大</p>
</header>
<main>
  <article class="body">アニメ放送中で頑張りながらも、ノベルゲームを製作中です。それに伴って主に英語圏で活動している内容をまとめています。

こうして話が膨らんでいくと人手が必要で、雑務係の方を月額で雇う方向に検討し、現在いい感じに相談中。
 やりたい規模に対して人員を増やしていく……普通に会社だなあ。
 そういうことも、あるのですね。
 英語圏に向けての活動、またはノベルゲームに興味ある方はいつでも応援してくださいね。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2026-05-11 15:32\n人员扩张\n人員拡大\n\nアニメ放送中で頑張りながらも、ノベルゲームを製作中です。それに伴って主に英語圏で活動している内容をまとめています。\n\nhttps://t.co/WTXwYfVQkV— HazeDenki (@hazedenki) May 9, 2026\n\nこうして話が膨らんでいくと人手が必要で、雑務係の方を月額で雇う方向に検討し、現在いい感じに相談中。\n やりたい規模に対して人員を増やしていく……普通に会社だなあ。\n そういうことも、あるのですね。\n 英語圏に向けての活動、またはノベルゲームに興味ある方はいつでも応援してくださいね。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
