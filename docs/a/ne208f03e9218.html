<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>失败的一天</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2026-01-05 05:44</p>
  <h1>失败的一天</h1>
  <p class="ja-title">ハズレの一日</p>
</header>
<main>
  <article class="body">お! ゲーセンにSNKの格ゲーが詰まった筐体があるぞ。
 筐体だとスコアランキングが流れてくるのが肝だよね。カプエスだとプレイヤーのネームが｢CAP｣｢CON｣｢VS｣｢SNK｣だったりして、なんだかゲーセン特有の文化で味があるよね。
 SNKのゲームならプレイヤー名は｢KOF｣｢SNK｣とか｢RYO｣とかかな？

なんなんだよ。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2026-01-05 05:44\n失败的一天\nハズレの一日\n\nお! ゲーセンにSNKの格ゲーが詰まった筐体があるぞ。\n 筐体だとスコアランキングが流れてくるのが肝だよね。カプエスだとプレイヤーのネームが｢CAP｣｢CON｣｢VS｣｢SNK｣だったりして、なんだかゲーセン特有の文化で味があるよね。\n SNKのゲームならプレイヤー名は｢KOF｣｢SNK｣とか｢RYO｣とかかな？\n\nなんなんだよ。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
