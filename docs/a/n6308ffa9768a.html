<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵拉拉觉得有趣的书籍15选 2021</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2021-12-28 23:26</p>
  <h1>喵拉拉觉得有趣的书籍15选 2021</h1>
  <p class="ja-title">にゃるらが読んで面白いと思った本15選 2021</p>
</header>
<main>
  <article class="body">这篇没有可提取的正文。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2021-12-28 23:26\n喵拉拉觉得有趣的书籍15选 2021\nにゃるらが読んで面白いと思った本15選 2021\n\n这篇没有可提取的正文。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
