<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太阳反对者用药</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2025-12-27 17:38</p>
  <h1>太阳反对者用药</h1>
  <p class="ja-title">太陽アンチ用の薬</p>
</header>
<main>
  <article class="body">飲むと太陽を浴びずとも活力を生成できる薬がある。部屋に篭りながら多少の不健康を抑えられるものの、服用すると副作用で12時間くらい眠ってしまう。
 この薬が必要なときは、たいてい朝までカフェイン漬けで作業をしており、起きて一気に終わらせたい締め切り前なので早朝くらいに飲む。強烈な眠気がカフェインの刺激を上書きする。
 朝に飲み、夕方におきる。太陽はすっかり消えていても活力が生成されている。というか、これくらい眠ったらある程度の気力は回復しているものだ、
 この薬は吸血鬼製造アイテムだなあと感じます。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2025-12-27 17:38\n太阳反对者用药\n太陽アンチ用の薬\n\n飲むと太陽を浴びずとも活力を生成できる薬がある。部屋に篭りながら多少の不健康を抑えられるものの、服用すると副作用で12時間くらい眠ってしまう。\n この薬が必要なときは、たいてい朝までカフェイン漬けで作業をしており、起きて一気に終わらせたい締め切り前なので早朝くらいに飲む。強烈な眠気がカフェインの刺激を上書きする。\n 朝に飲み、夕方におきる。太陽はすっかり消えていても活力が生成されている。というか、これくらい眠ったらある程度の気力は回復しているものだ、\n この薬は吸血鬼製造アイテムだなあと感じます。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
