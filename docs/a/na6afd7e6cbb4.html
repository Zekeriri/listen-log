<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>“16bit 感觉 ANOTHER LAYER” 尼迪加合作纪念。听 喵拉拉 先生说，美少女游戏会走向何方</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2024-01-04 04:38</p>
  <h1>“16bit 感觉 ANOTHER LAYER” 尼迪加合作纪念。听 喵拉拉 先生说，美少女游戏会走向何方</h1>
  <p class="ja-title">「16bitセンセーション ANOTHER LAYER」ニディガコラボ記念。にゃるら氏に聞く，美少女ゲームはどこへ行くのか</p>
</header>
<main>
  <article class="body">インタビューを受けたので記録。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2024-01-04 04:38\n“16bit 感觉 ANOTHER LAYER” 尼迪加合作纪念。听 喵拉拉 先生说，美少女游戏会走向何方\n「16bitセンセーション ANOTHER LAYER」ニディガコラボ記念。にゃるら氏に聞く，美少女ゲームはどこへ行くのか\n\nインタビューを受けたので記録。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
