<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随笔：深夜秋叶原大战</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2019-07-24 21:31</p>
  <h1>随笔：深夜秋叶原大战</h1>
  <p class="ja-title">エッセイ：深夜の秋葉原戦争</p>
</header>
<main>
  <article class="body">这篇没有可提取的正文。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制译文</button></div>
<div class="toast" id="toast"></div>
<script id="zh-copy" type="application/json">"随笔：深夜秋叶原大战\n\n此版本不包含原文。"</script>
<script>
const text = JSON.parse(document.getElementById("zh-copy").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  else box.style.display = "none";
  toast.textContent = ok ? "已复制译文" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 2500);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
