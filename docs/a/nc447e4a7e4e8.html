<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请回去或返回。</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2026-07-13 16:26</p>
  <h1>请回去或返回。</h1>
  <p class="ja-title">戻ったり、帰ったりをしてください。</p>
</header>
<main>
  <article class="body">きっと死ぬまでは日記を書くので、毎日必ず僕はここに居ることとなる。
 もう七年、日記以外のエッセイを含めると十年以上、ネットで文章を欠かさず書いている。
 多くの方が通り過ぎていきます。
 けれども、自分は自殺をするまではここにいるでしょう。自分から死なない自信はありませんが、それまで文を書く、文化を紡ぐことを諦めることはないはずで。
 だから、いつでも覗いて、いつでもどこかで飽きたりアンチになってしまったり、それでもまたなんか戻ってきたり。
 そういう感じで死ぬまで生きていきましょう。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制标题和全文</button></div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json">"请把下面这篇日文翻译成简体中文，并朗读。\n\n2026-07-13 16:26\n请回去或返回。\n戻ったり、帰ったりをしてください。\n\nきっと死ぬまでは日記を書くので、毎日必ず僕はここに居ることとなる。\n もう七年、日記以外のエッセイを含めると十年以上、ネットで文章を欠かさず書いている。\n 多くの方が通り過ぎていきます。\n けれども、自分は自殺をするまではここにいるでしょう。自分から死なない自信はありませんが、それまで文を書く、文化を紡ぐことを諦めることはないはずで。\n だから、いつでも覗いて、いつでもどこかで飽きたりアンチになってしまったり、それでもまたなんか戻ってきたり。\n そういう感じで死ぬまで生きていきましょう。"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  toast.textContent = ok ? "已复制，可以贴给手机上的 AI" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 4000);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
