<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note 的订阅者日记本月更新两次后将停止使用。感谢您阅读到现在...</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="back" href="../index.html">返回目录</a>
  <p class="date">2023-04-07 22:26</p>
  <h1>Note 的订阅者日记本月更新两次后将停止使用。感谢您阅读到现在...</h1>
  <p class="ja-title">noteの購読者向け日記、今月で2回更新後に廃刊します。今まで読んでくれてあ…</p>
</header>
<main>
  <article class="body">noteの購読者向け日記、今月で2回更新後に廃刊します。今まで読んでくれてありがとうございました♪ 毎日の日記は続けるので、よければそちらも読んでいってくださいね。</article>
  <textarea id="manual" readonly></textarea>
</main>
<div class="bar"><button id="copy" type="button">复制译文</button></div>
<div class="toast" id="toast"></div>
<script id="zh-copy" type="application/json">"Note 的订阅者日记本月更新两次后将停止使用。感谢您阅读到现在...\n\nNote 的订阅者日记本月更新两次后将停止使用。感谢您到目前为止的阅读♪我会继续写日记，所以如果您愿意，请阅读它。"</script>
<script>
const text = JSON.parse(document.getElementById("zh-copy").textContent);
const toast = document.getElementById("toast");
const box = document.getElementById("manual");
function selectPack() {
  box.value = text;
  box.style.display = "block";
  box.focus();
  box.select();
}
async function copyText() {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    selectPack();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  }
  if (!ok) selectPack();
  else box.style.display = "none";
  toast.textContent = ok ? "已复制译文" : "没有自动复制。下面的文字已选中，请长按后复制";
  toast.style.display = "block";
  clearTimeout(copyText._t);
  copyText._t = setTimeout(() => { toast.style.display = "none"; }, 2500);
}
document.getElementById("copy").addEventListener("click", copyText);
</script>
</body>
</html>
